<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Example Project</title>
  <style>
    :root {
      --bg: #fafaf9;
      --text: #1c1917;
      --muted: #57534e;
      --accent: #2563eb;
      --card: #ffffff;
      --border: #e7e5e4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --text: #f5f5f4;
        --muted: #a8a29e;
        --accent: #60a5fa;
        --card: #292524;
        --border: #44403c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 64px 16px;
    }
    h1 { font-size: 2.5rem; margin: 0 0 8px; }
    .lead { color: var(--muted); font-size: 1.2rem; margin: 0 0 40px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .card h2 { font-size: 1.1rem; margin: 0 0 6px; }
    .card p { margin: 0; color: var(--muted); }
    a.button {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
    }
    footer { margin-top: 64px; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, world</h1>
    <p class="lead">A simple one-page site to get started.</p>

    <section class="cards">
      <div class="card">
        <h2>Simple</h2>
        <p>One HTML file, no build step.</p>
      </div>
      <div class="card">
        <h2>Responsive</h2>
        <p>Looks good on phones and desktops.</p>
      </div>
      <div class="card">
        <h2>Dark mode</h2>
        <p>Follows your system theme.</p>
      </div>
    </section>

    <a class="button" href="#" onclick="alert('Hi there!'); return false;">Say hi</a>

    <footer>&copy; 2026 Example Project</footer>
  </main>
</body>
</html>
